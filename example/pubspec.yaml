name: state_restoration_desktop_example
description: "Demonstrates how to use the state_restoration_desktop plugin."
publish_to: 'none'

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.5.0
  state_restoration_desktop:
    # When depending on this package from a real application you should use:
    #   state_restoration_desktop: ^x.y.z
    # See https://dart.dev/tools/pub/dependencies#version-constraints
    # The example app is bundled with the plugin so we use a path dependency on
    # the parent directory to use the current plugin's version.
    path: ../

dev_dependencies:
  zekfad_lints: ^2.4.0

flutter:
  uses-material-design: true
